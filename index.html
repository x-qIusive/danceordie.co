    <script>
      (() => {
        const canvas = document.getElementById('visual');
        const ctx = canvas.getContext('2d', { alpha: false });
        const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
        const streaks = [];
        let width = 0;
        let height = 0;
        let frameId = 0;
        let previousTime = performance.now();
        let elapsed = 0;
        let nextCluster = 180;
        let quietUntil = 0;
        let flash = 0;
        let shake = 0;


        function resize() {
          const dpr = Math.min(devicePixelRatio || 1, 2);
          width = innerWidth;
          height = innerHeight;
          canvas.width = Math.floor(width * dpr);
          canvas.height = Math.floor(height * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          if (reduceMotion.matches) drawStill();
        }

        function spawnCluster() {
          const y = Math.random() * height;
          const count = 2 + Math.floor(Math.random() * 6);
          for (let i = 0; i < count; i++) {
            const lineWidth = width * (.55 + Math.random() * .65);
            streaks.push({
              x: width * (-.12 + Math.random() * .2),
              y: y + i * (2 + Math.random() * 8),
              width: lineWidth,
              height: 1 + Math.random() * 6,
              age: 0,
              duration: 90 + Math.random() * 240,
              drift: -220 + Math.random() * 440,
              phase: Math.random() * Math.PI * 2,
              segments: Array.from({ length: 8 + Math.floor(Math.random() * 9) }, () => .2 + Math.random() * .8)
            });
          }
          if (Math.random() < .5) flash = 25 + Math.random() * 50;
          shake = 70 + Math.random() * 110;
          if (Math.random() < .2) quietUntil = elapsed + 700 + Math.random() * 1300;
        }

        function drawStreak(line, delta) {
          line.age += delta;
          const progress = line.age / line.duration;
          if (progress >= 1) return false;
          const envelope = Math.sin(progress * Math.PI);
          const flicker = .64 + Math.sin(elapsed * .045 + line.phase) * .22 + Math.random() * .14;
          const opacity = Math.max(0, Math.min(1, envelope * flicker));
          const x = line.x + line.drift * line.age / 1000;
          const jitterX = Math.round((Math.random() - .5) * 5);
          const jitterY = Math.random() < .12 ? Math.round((Math.random() - .5) * 2) : 0;
          ctx.save();
          ctx.fillStyle = '#fff';
          ctx.globalAlpha = opacity * .11;
          ctx.fillRect(x + jitterX - 8, line.y + jitterY - 2, line.width + 16, line.height + 4);
          let cursor = 0;
          const gap = Math.max(1, line.width * .006);
          line.segments.forEach((factor, index) => {
            const segmentWidth = line.width / line.segments.length * factor;
            ctx.globalAlpha = opacity * (.36 + Math.random() * .38);
            ctx.fillRect(x + jitterX + cursor, line.y + jitterY, segmentWidth, line.height);
            if (opacity > .82 && index % 3 === 0) {
              ctx.globalAlpha = 1;
              ctx.fillRect(x + jitterX + cursor + segmentWidth * .24, line.y + jitterY, Math.max(2, segmentWidth * .22), Math.min(1, line.height));
            }
            cursor += segmentWidth + gap * (.5 + Math.random() * 2.5);
          });
          ctx.restore();
          return true;
        }

        function drawTexture() {
          ctx.save();
          ctx.fillStyle = '#fff';
          const specks = Math.max(12, Math.floor(width * height / 65000));
          for (let i = 0; i < specks; i++) {
            ctx.globalAlpha = Math.random() * .045;
            ctx.fillRect(Math.random() * width, Math.random() * height, Math.random() < .9 ? 1 : 2 + Math.random() * 6, 1);
          }
          ctx.restore();
        }

        function render(delta) {
          elapsed += delta;
          ctx.fillStyle = '#000';
          ctx.fillRect(0, 0, width, height);
          drawTexture();

          if (elapsed >= nextCluster && elapsed >= quietUntil) {
            spawnCluster();
            nextCluster = elapsed + 260 + Math.random() * 620;
          }

          if (shake > 0) {
            ctx.save();
            ctx.globalAlpha = .12;
            ctx.fillStyle = '#fff';
            ctx.fillRect(-20 + Math.random() * 40, Math.random() * height, width, .5 + Math.random() * 1.5);
            ctx.restore();
            shake -= delta;
          }

          for (let i = streaks.length - 1; i >= 0; i--) {
            if (!drawStreak(streaks[i], delta)) streaks.splice(i, 1);
          }

          if (flash > 0) {
            ctx.save();
            ctx.globalAlpha = flash / 500;
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, width, height);
            ctx.restore();
            flash -= delta;
          }
        }

        function drawStill() {
          ctx.fillStyle = '#000';
          ctx.fillRect(0, 0, width, height);
        }

        function animate(now) {
          const delta = Math.min(50, now - previousTime);
          previousTime = now;
          render(delta);
          frameId = requestAnimationFrame(animate);
        }

        function updateMotion() {
          cancelAnimationFrame(frameId);
          if (reduceMotion.matches) drawStill();
          else { previousTime = performance.now(); frameId = requestAnimationFrame(animate); }
        }

        const prevent = event => event.preventDefault();
        addEventListener('resize', resize);
        reduceMotion.addEventListener('change', updateMotion);
        document.addEventListener('gesturestart', prevent, { passive: false });
        document.addEventListener('gesturechange', prevent, { passive: false });
        document.addEventListener('gestureend', prevent, { passive: false });
        document.addEventListener('touchmove', event => { if (event.touches.length > 1) prevent(event); }, { passive: false });
        document.addEventListener('wheel', event => { if (event.ctrlKey || event.metaKey) prevent(event); }, { passive: false });
        document.addEventListener('dblclick', prevent, { passive: false });
        document.addEventListener('keydown', event => {
          if ((event.ctrlKey || event.metaKey) && ['+', '-', '=', '0'].includes(event.key)) prevent(event);
        });
        resize();
        updateMotion();
      })();
    </script>
  </body>
</html>
